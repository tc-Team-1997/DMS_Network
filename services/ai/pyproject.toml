[project]
name = "zordms-ai"
version = "0.1.0"
description = "ZorDMS AI / IDP service (two-stage VLM document processing)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "pillow>=10.3",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
]
db = [
    "psycopg[binary]>=3.1",
    "oracledb>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zordms_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
