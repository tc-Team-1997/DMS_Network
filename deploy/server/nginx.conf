# ZorDMS web — nginx reverse proxy.
#
# Serves the SPA bundle and proxies the /svc/<service>/* paths to each backend
# container. Mirrors the Vite dev proxy in apps/web/vite.config.ts so a single
# codebase works the same in dev and prod.

upstream gateway      { server gateway:4000; }
upstream core         { server core:4001; }
upstream workflow     { server workflow:4002; }
upstream notify       { server notify:4003; }
upstream search       { server search:4004; }
upstream integration  { server integration:4005; }
upstream ai           { server ai:8080; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # ── /svc/<service> proxies (canonical) ─────────────────────────────────
    location /svc/gateway/ {
        proxy_pass http://gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /svc/core/ {
        proxy_pass http://core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /svc/workflow/ {
        proxy_pass http://workflow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # notify supports WebSockets (realtime alerts).
    location /svc/notify/ {
        proxy_pass http://notify/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /svc/search/ {
        proxy_pass http://search/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /svc/integrate/ {
        proxy_pass http://integration/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /svc/ai/ {
        proxy_pass http://ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Legacy direct paths (backwards-compat, mirrors vite.config.ts) ─────
    location /auth/   { proxy_pass http://gateway/auth/;   proxy_set_header Host $host; }
    location /authz/  { proxy_pass http://gateway/authz/;  proxy_set_header Host $host; }
    location /health  { proxy_pass http://gateway/health;  proxy_set_header Host $host; }

    # ── SPA fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
